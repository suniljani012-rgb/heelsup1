# ─────────────────────────────────────────────────────────────────
# HeelsUp — Auto Deploy to Cloudflare
# Trigger: git push to main branch
# Requirements (GitHub Secrets):
#   CLOUDFLARE_API_TOKEN — from Cloudflare dashboard → API Tokens
# ─────────────────────────────────────────────────────────────────
name: Deploy HeelsUp to Cloudflare

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker + Pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Cloudflare Worker (backend API)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
